name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Signing key from repository secrets
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p signing
            echo "$KEYSTORE_B64" | base64 -d > signing/drehzahl-release.jks
            printf 'KEYSTORE=signing/drehzahl-release.jks\nKEYSTORE_PASS=%s\nKEY_ALIAS=drehzahl\n' "$KEYSTORE_PASS" > signing/keystore.properties
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "No KEYSTORE_B64 secret: building with a throwaway key, no release will be published."
          fi

      - name: Build
        run: bash build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Drehzahl-apk
          path: build/out/*.apk

      - name: Publish latest-build release
        if: env.SIGNED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build build/out/*.apk \
            --title "Latest build ($(cat VERSION), ${GITHUB_SHA::7})" \
            --notes "Built automatically from ${GITHUB_SHA}. Install with the PC toolkit: START HERE.bat, option 4." \
            --prerelease
